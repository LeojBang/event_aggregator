[project]
name = "event-aggregator"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Maxim Merkulov", email = "m.merkulovdodo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi",
    "greenlet>=3.5.5",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors (PEP8)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (imports)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
